<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="popup.css" />
    <title>Verifact Fact-Check</title>
  </head>
  <body>
    <header class="header">
      <img src="icons/48.png" alt="" width="28" height="28" />
      <div class="title">
        <strong>Verifact</strong>
        <span class="sub">Fact-Check</span>
      </div>
      <span id="mode" class="badge badge-anon">Anonymous</span>
    </header>

    <section id="auth" class="auth">
      <span id="auth-label" class="auth-label">Not signed in — 3 free checks / 30 days</span>
      <button id="login" class="btn btn-ghost" type="button">Log in</button>
      <button id="logout" class="btn btn-ghost hidden" type="button">Log out</button>
    </section>

    <section class="form">
      <label class="field">
        <span>Content to verify</span>
        <textarea id="text" rows="5" placeholder="Paste the claim, text, or article URL…"></textarea>
        <small id="text-help" class="hint">10–2000 characters.</small>
      </label>

      <div class="row">
        <label class="field">
          <span>Input type</span>
          <select id="inputType">
            <option value="text">Text</option>
            <option value="url">URL</option>
            <option value="screenshot">Screenshot</option>
          </select>
        </label>

        <label class="field">
          <span>Language</span>
          <select id="language">
            <option value="unknown">Auto</option>
            <option value="ro">Română</option>
            <option value="en">English</option>
            <option value="fr">Français</option>
          </select>
        </label>
      </div>

      <label class="check">
        <input id="isPublic" type="checkbox" />
        <span>Make this report public</span>
      </label>

      <button id="verify" class="btn btn-primary" type="button">Verify</button>
      <p id="status" class="status"></p>
    </section>

    <section id="result" class="result hidden" aria-live="polite"></section>

    <footer class="footer">
      <span id="usage" class="usage"></span>
    </footer>

    <script src="popup.js"></script>
  </body>
</html>
