# LiteLLM gateway — model aliases in front of multiple providers.
# Call these `model_name` aliases from the app (OPENROUTER_MODEL) or crewAI
# (CREW_MODEL); switch the underlying provider here without touching code.
# Docs: https://docs.litellm.ai/docs/proxy/configs
model_list:
  # --- Google Gemini (direct) ---
  - model_name: gemini-flash
    litellm_params:
      model: gemini/gemini-1.5-flash
      api_key: os.environ/GEMINI_API_KEY

  # --- DeepSeek (direct) ---
  - model_name: deepseek-chat
    litellm_params:
      model: deepseek/deepseek-chat
      api_key: os.environ/DEEPSEEK_API_KEY

  # --- Mistral (EU provider, direct) ---
  - model_name: mistral-small
    litellm_params:
      model: mistral/mistral-small-latest
      api_key: os.environ/MISTRAL_API_KEY

  # --- OpenRouter (aggregator) — keeps the app's current default reachable ---
  - model_name: openrouter-deepseek
    litellm_params:
      model: openrouter/deepseek/deepseek-chat
      api_key: os.environ/OPENROUTER_API_KEY

# Route by config: point the app's default alias at whichever provider is up.
router_settings:
  routing_strategy: simple-shuffle

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY

litellm_settings:
  drop_params: true
  # Fail over to the next healthy model on provider errors.
  num_retries: 2
