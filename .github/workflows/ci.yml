name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.placeholder
      SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.placeholder
      GOOGLE_CLOUD_API_KEY: placeholder
      GOOGLE_FACT_CHECK_API_KEY: placeholder
      GOOGLE_CUSTOM_SEARCH_API_KEY: placeholder
      GOOGLE_CUSTOM_SEARCH_ENGINE_ID: placeholder
      GEMINI_API_KEY: placeholder
      NEWS_API_KEY: placeholder
      NEXTAUTH_SECRET: placeholdersecret32charactersminimum

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: TypeScript type check
        run: npm run type-check

      - name: ESLint check
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Next.js build
        run: npm run build
