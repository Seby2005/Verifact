name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.placeholder
      SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.placeholder
      GOOGLE_CLOUD_API_KEY: placeholder
      GOOGLE_FACT_CHECK_API_KEY: placeholder
      GOOGLE_CUSTOM_SEARCH_API_KEY: placeholder
      GOOGLE_CUSTOM_SEARCH_ENGINE_ID: placeholder
      GEMINI_API_KEY: placeholder
      TAVILY_API_KEY: placeholder
      NEWS_API_KEY: placeholder
      NEXTAUTH_SECRET: placeholdersecret32charactersminimum

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      # If this step is red: run `npm audit` locally for details. As of this
      # workflow being added, the only high-severity findings trace back to
      # transitive deps of `next` and `eslint`, and npm's suggested fix for
      # both is a major-version bump (next 14→16, eslint 8→10) — deliberately
      # NOT applied here. Next 15+ made next/headers's cookies() and route
      # params async, which touches many files in this codebase, and eslint
      # 9+ requires migrating .eslintrc.json to flat config; both need their
      # own dedicated, tested migration rather than being a side effect of
      # adding this scan.
      - name: Audit dependencies for known vulnerabilities
        run: npm audit --audit-level=high

      - name: TypeScript type check
        run: npm run type-check

      - name: ESLint check
        run: npm run lint

      # Runs the same suite as `npm test` plus the coverageThreshold gate in
      # jest.config.cjs (70% statements/lines/functions, 50% branches on
      # src/lib) — a separate `npm test` step would just duplicate this run.
      - name: Unit tests with coverage
        run: npm run test:coverage

      - name: Next.js build
        run: npm run build
