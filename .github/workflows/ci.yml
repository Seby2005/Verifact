name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.placeholder
      SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.placeholder
      GOOGLE_CLOUD_API_KEY: placeholder
      GOOGLE_FACT_CHECK_API_KEY: placeholder
      GOOGLE_CUSTOM_SEARCH_API_KEY: placeholder
      GOOGLE_CUSTOM_SEARCH_ENGINE_ID: placeholder
      GEMINI_API_KEY: placeholder
      TAVILY_API_KEY: placeholder
      NEWS_API_KEY: placeholder
      NEXTAUTH_SECRET: placeholdersecret32charactersminimum

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      # The high-severity advisories that were previously deferred all traced
      # back to transitive deps of next 14 and eslint 8, fixable only by a
      # major bump. That migration is done — next 14→16 (async cookies()/route
      # params) and eslint 8→9 with eslint-config-next 16 (flat config) — and
      # `npm audit` now reports 0 vulnerabilities. The high scan is blocking
      # again; since --audit-level=high also fails on critical, it subsumes the
      # separate critical step this replaced. Run `npm audit` locally for details.
      - name: Audit dependencies (high — blocking)
        run: npm audit --audit-level=high

      - name: TypeScript type check
        run: npm run type-check

      - name: ESLint check
        run: npm run lint

      # Runs the same suite as `npm test` plus the coverageThreshold gate in
      # jest.config.cjs (70% statements/lines/functions, 50% branches on
      # src/lib) — a separate `npm test` step would just duplicate this run.
      - name: Unit tests with coverage
        run: npm run test:coverage

      - name: Next.js build
        run: npm run build
