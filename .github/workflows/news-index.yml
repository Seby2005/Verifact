name: News index

# Refreshes Verifact's own news index (src/lib/news-index) by calling the
# ingestion endpoint. It lives here rather than in vercel.json because Vercel's
# cron runs at most once a day on the current plan, and RSS feeds only carry an
# outlet's latest 10-50 headlines: at a daily cadence most of them would be
# gone before they were read.
#
# Needs the repository secret CRON_SECRET (same value as in Vercel). The site
# address can be overridden with the repository variable APP_URL.
#
# GitHub pauses scheduled workflows after 60 days without repository activity;
# the daily provider-health check reports the index as stale if that happens.

on:
  schedule:
    # Off the hour on purpose: GitHub delays or drops runs queued at :00.
    - cron: '7,37 * * * *'
  workflow_dispatch:

concurrency:
  group: news-index
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Refresh the news index
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          # The www host on purpose: verifact.ro answers 308 to it, and curl
          # neither follows a redirect nor carries the secret across hosts.
          APP_URL: ${{ vars.APP_URL || 'https://www.verifact.ro' }}
        run: |
          # Not configured yet: skip instead of failing, or GitHub would mail a
          # failure notice every half hour until the secret is added.
          if [ -z "$CRON_SECRET" ]; then
            echo "::warning::The CRON_SECRET repository secret is not set; skipping the refresh."
            exit 0
          fi
          # Anything but 200 fails the run, a redirect included: it would
          # otherwise pass as a success while nothing was ingested.
          status=$(curl --silent --show-error --max-time 90 \
            -o response.txt -w '%{http_code}' \
            -X POST -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/cron/news-index")
          cat response.txt
          if [ "$status" != "200" ]; then
            echo "::error::The news index endpoint answered HTTP $status."
            exit 1
          fi
